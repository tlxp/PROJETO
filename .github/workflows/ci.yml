# --- Workflow CI: validação contínua do monorepo ---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # --- Job: backend Python (pytest, locks, pip-audit) ---
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Instalar dependências (lock reproduzível)
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
      - name: Validar locks Python atualizados
        working-directory: backend
        run: |
          pip install pip-tools
          python -m piptools compile requirements.txt -o /tmp/requirements.lock --strip-extras --generate-hashes --quiet
          python -m piptools compile requirements-dev.txt -o /tmp/requirements-dev.lock --strip-extras --generate-hashes --quiet
          diff -u <(tail -n +7 requirements.lock) <(tail -n +7 /tmp/requirements.lock)
          diff -u <(tail -n +7 requirements-dev.lock) <(tail -n +7 /tmp/requirements-dev.lock)
      - name: Compilar módulos
        run: python -m compileall backend
      - name: Auditoria de dependências Python
        working-directory: backend
        run: pip-audit -r requirements.lock --skip-editable
      - name: Testes com cobertura
        working-directory: backend
        run: python -m pytest tests -q --cov --cov-report=term-missing

  # --- Job: frontend React/Vite (lint, test, build) ---
  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria de dependências npm
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Testes
        run: npm run test
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Build
        run: npm run build

  # --- Job: testes E2E Playwright ---
  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar browsers Playwright
        run: npx playwright install chromium --with-deps
      - name: Testes E2E
        run: npm run test:e2e

  # --- Job: .NET (WPF + vm-agent) — requer windows-latest ---
  dotnet:
    name: .NET (WPF + vm-agent)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build e testes unitários
        run: dotnet test RatAnalyzer.sln -c Release

  # --- Job: encoding UTF-8 dos scripts PowerShell ---
  ps1-encoding:
    name: Scripts PowerShell (UTF-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validar encoding UTF-8
        run: python scripts/ci/check_ps1_utf8.py

  # --- Job: links e ortografia em ficheiros Markdown ---
  md-docs:
    name: Documentação (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validar links e ortografia em .md
        run: python scripts/ci/check_md_links.py

  # --- Job: diagramas PlantUML sincronizados com o relatório ---
  diagrams:
    name: Diagramas (PlantUML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validar PNG do relatório vs docs/diagrams/
        run: python scripts/ci/sync_diagrams_to_report.py --check

  # --- Job: sintaxe PowerShell (parser nativo no Windows) ---
  powershell:
    name: Scripts PowerShell (sintaxe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar encoding UTF-8
        run: python scripts/ci/check_ps1_utf8.py
      - name: Validar sintaxe dos .ps1
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "ERROS em $($_.FullName):"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (linha $($_.Extent.StartLineNumber))" }
            }
          }
          if ($failed) { exit 1 }

  # --- Job: deteção de segredos com gitleaks ---
  security:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
